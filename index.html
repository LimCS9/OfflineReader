<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CBZ Reader">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>CBZ Reader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #1a1a1a;
      --surf:   #242424;
      --border: #333;
      --accent: #FF6B35;
      --text:   #f0f0f0;
      --muted:  #888;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overscroll-behavior: none;
    }

    /* ── Upload ── */
    #upload-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      gap: 1.1rem;
      text-align: center;
    }

    .app-icon {
      width: 84px; height: 84px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .app-icon img { width: 100%; height: 100%; display: block; }

    h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -.5px; }
    .subtitle { color: var(--muted); font-size: .88rem; line-height: 1.6; max-width: 280px; }

    #drop-zone {
      width: 100%; max-width: 360px;
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(255,107,53,.06);
    }
    .drop-icon { font-size: 2.2rem; margin-bottom: .4rem; display: block; }
    .drop-label { font-size: .82rem; color: var(--muted); margin-top: .3rem; }

    .open-btn {
      width: 100%; max-width: 360px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .open-btn:active { opacity: .75; }

    #file-input { display: none; }

    .hint { font-size: .74rem; color: var(--muted); }

    /* ── Loading ── */
    #loading-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      gap: 1rem;
    }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { color: var(--muted); font-size: .9rem; max-width: 260px; text-align: center; }

    /* ── Reader ── */
    #reader-screen {
      display: none;
      position: relative;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #reader-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: .4rem;
      /* push content below the status bar in PWA black-translucent mode */
      padding: calc(.5rem + env(safe-area-inset-top, 0px)) .6rem .5rem;
      background: rgba(16,16,16,.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,.06);
      transform: translateY(0);
      transition: transform .25s ease;
    }
    #reader-header.header-hidden {
      transform: translateY(-110%);
      pointer-events: none;
    }

    .icon-btn {
      background: none; border: none;
      color: var(--text);
      cursor: pointer;
      padding: .4rem;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { background: var(--border); }

    #comic-title {
      flex: 1;
      font-size: .82rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    #chapter-nav {
      display: flex;
      align-items: center;
      gap: .1rem;
      flex-shrink: 0;
    }
    #chapter-label {
      background: none; border: none;
      color: var(--muted);
      font-size: .74rem;
      cursor: default;
      padding: .25rem .35rem;
      white-space: nowrap;
    }

    #mode-toggle {
      font-size: .72rem;
      color: var(--muted);
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .25rem .4rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    #mode-toggle:active { opacity: .7; }

    #page-indicator {
      font-size: .75rem; color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* ── Pages — absolute fill so header can overlay without pushing content ── */
    #reader-pages {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .page-wrapper {
      width: 100%;
      flex-shrink: 0;
    }
    .page-wrapper.ch-hidden { display: none; }

    .comic-page {
      display: block;
      width: 100%;
      height: auto;
    }
    .comic-page.placeholder {
      aspect-ratio: 2/3;
      background: #111;
    }

    .chapter-divider {
      padding: .55rem 1rem;
      font-size: .75rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--surf);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    /* ── Auto-scroll bar ── */
    #autoscroll-bar {
      position: fixed;
      bottom: max(1.25rem, env(safe-area-inset-bottom, 1.25rem));
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: .5rem;
      background: rgba(20,20,20,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: .45rem .9rem;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }

    .as-btn {
      background: none; border: none;
      color: var(--text);
      font-size: 1.1rem;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .as-btn:active { background: var(--border); }

    #as-playpause {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 50%;
      font-size: .8rem;
    }
    #as-playpause:active { opacity: .8; }

    #as-speed-label {
      font-size: .82rem;
      color: var(--text);
      min-width: 2.8rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Upload -->
  <div id="upload-screen">
    <div class="app-icon"><img src="icon.svg" alt=""></div>
    <h1>CBZ Reader</h1>
    <p class="subtitle">Read comic archives offline.<br>Files never leave your device.</p>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
      <span class="drop-icon">📖</span>
      <p style="font-weight:600">Drop files here</p>
      <p class="drop-label">or tap to browse</p>
    </div>

    <button class="open-btn" onclick="document.getElementById('file-input').click()">
      Open Comic
    </button>

    <p class="hint">Single CBZ · ZIP with chapters · Multiple CBZs at once</p>

    <!-- multiple: lets user pick several CBZ files at once on any platform -->
    <input type="file" id="file-input" accept=".cbz,.zip,application/zip" multiple>
  </div>

  <!-- Loading -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p id="loading-text">Opening…</p>
  </div>

  <!-- Reader -->
  <div id="reader-screen">
    <header id="reader-header">
      <button class="icon-btn" id="close-btn" title="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
      </button>

      <span id="comic-title">Comic</span>

      <div id="chapter-nav" class="hidden">
        <button class="icon-btn" id="prev-ch" title="Prev chapter">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <span id="chapter-label">Ch 1 / 1</span>
        <button class="icon-btn" id="next-ch" title="Next chapter">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>

      <button id="mode-toggle" class="hidden">Scroll</button>

      <!-- auto-scroll toggle button in header -->
      <button class="icon-btn" id="autoscroll-toggle" title="Auto-scroll">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="2" x2="12" y2="22"/>
          <polyline points="6 16 12 22 18 16"/>
          <polyline points="6 8 12 2 18 8"/>
        </svg>
      </button>

      <span id="page-indicator">1 / 1</span>
    </header>

    <div id="reader-pages"></div>

    <!-- Floating auto-scroll controls -->
    <div id="autoscroll-bar" class="hidden">
      <button class="as-btn" id="as-slower" title="Slower">−</button>
      <button class="as-btn" id="as-playpause">▶</button>
      <span id="as-speed-label">1.0×</span>
      <button class="as-btn" id="as-faster" title="Faster">+</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
